<!DOCTYPE html>
<html>
    <head>
        <title>Google Search Clone</title>
    </head>
    <body>
        <!-- 1. الشعار (صورة من الإنترنت) -->
        <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google Logo">

        <!-- 2. النموذج الذي يرسل البحث لجوجل -->
        <!-- الخاصية action تخبر المتصفح أين يرسل الكلمة التي كتبتها -->
        <form action="https://google.com/search">
            <!-- الخاصية name="q" ضرورية لأن جوجل الحقيقي يبحث عن متغير اسمه q -->
            <input type="text" name="q">
            
            <br>
            
            <!-- زر البحث -->
            <input type="submit" value="Google Search">
        </form>
    </body>
</html>
